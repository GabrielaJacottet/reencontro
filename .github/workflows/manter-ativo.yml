on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS "https://fcxambvdgzteutokpgqs.supabase.co/rest/v1/pets?select=id&limit=1"
          -H "apikey: sb_publishable_nxpqq2s8lBZ5rr3xAG-J-Q_7vxWeYuB"
