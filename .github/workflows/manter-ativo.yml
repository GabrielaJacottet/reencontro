# Grava um "sinal de vida" no Supabase todo dia para o plano gratuito não pausar o projeto (pausa após 7 dias sem uso).
# Só ler a cada 3 dias não bastou: o aviso de pausa chegou mesmo assim (nov/2026).
name: Manter o Supabase ativo
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
jobs:
  sinal:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS -X POST "https://fcxambvdgzteutokpgqs.supabase.co/rest/v1/rpc/manter_ativo"
          -H "apikey: sb_publishable_nxpqq2s8lBZ5rr3xAG-J-Q_7vxWeYuB"
          -H "Content-Type: application/json"
          -d "{}"
